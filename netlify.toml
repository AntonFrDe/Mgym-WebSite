# netlify.toml — le projet n'est pas à la racine du dépôt.
#
# Sans `base`, Netlify cherche package.json ici et ne trouve rien : le
# premier déploiement s'est terminé sur « No build steps found » puis a
# publié le dépôt brut, en annonçant « Site is live ».
#
# `publish` et le greffon sont déclarés EXPLICITEMENT. Netlify détecte
# bien Next.js, mais sans ces deux lignes il a publié le dossier de base
# tel quel : « 1 new file(s), 0 new function(s) ». Zéro fonction signifie
# que /api/preview et /api/preview-exit n'existent pas en production —
# donc pas de prévisualisation des brouillons pour la cliente.
[build]
  base    = "Mgym-Next"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Identifiants PUBLICS de Sanity ──────────────────────────────
#
# Ils ne sont pas secrets : ils figurent dans l'URL de l'API, que
# n'importe quel visiteur peut lire. Le préfixe NEXT_PUBLIC_ le dit
# d'ailleurs explicitement.
#
# Ils sont ici plutôt que dans l'interface de Netlify pour deux raisons.
# D'abord, une variable saisie dans l'interface peut avoir une portée qui
# exclut le build — et c'est arrivé : le site se construisait sans CMS et
# servait son contenu de secours, sans la moindre erreur. Ensuite, un
# dépôt cloné se construit ici correctement du premier coup.
#
# Les deux VRAIS secrets — SANITY_API_READ_TOKEN et SANITY_PREVIEW_SECRET
# — restent dans l'interface de l'hébergeur. Ils ne doivent jamais être
# commités, et le dépôt est public.
[build.environment]
  NEXT_PUBLIC_SANITY_PROJECT_ID  = "zqxwi6qy"
  NEXT_PUBLIC_SANITY_DATASET     = "production"
  NEXT_PUBLIC_SANITY_API_VERSION = "2024-10-01"
